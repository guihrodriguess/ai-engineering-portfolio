name: CI (05-app-producao)

# Workflows do GitHub Actions só são reconhecidos em .github/workflows/ na
# RAIZ do repositório — não dentro da pasta de cada projeto (é por isso que
# este arquivo não vive em 05-app-producao/.github/, onde estava antes).
# O filtro de `paths` abaixo garante que só roda quando esse projeto muda,
# já que o repositório é um monorepo com os 5 projetos do portfólio.

on:
  push:
    branches: [main]
    paths: ['05-app-producao/**', '.github/workflows/ci-05-app-producao.yml']
  pull_request:
    branches: [main]
    paths: ['05-app-producao/**', '.github/workflows/ci-05-app-producao.yml']

defaults:
  run:
    working-directory: 05-app-producao

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app_producao
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/app_producao
      # RLS exige app_user; a migração e as funções de auth (etapa seguinte)
      # precisam existir antes desta variável fazer sentido, mas ela já
      # aponta pra role correta desde já.
      DATABASE_URL: postgres://app_user:app_user_dev_only@localhost:5432/app_producao

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 05-app-producao/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` já roda o type-check internamente (gera .next/types antes
      # de checar) — um `tsc --noEmit` isolado aqui falharia: LayoutProps e
      # outros tipos só existem depois que o Next gera esses arquivos.
      - name: Build de produção (inclui type-check)
        run: npm run build

      - name: Cria a role app_user (services do GitHub Actions não suportam volume de init SQL)
        run: psql "$DATABASE_URL_ADMIN" -f db/sql/01-role-app-user.sql

      - name: Aplica migrations + funções de auth
        run: npm run db:migrate

      - name: Testes (integração real contra Postgres, incluindo isolamento por RLS)
        run: npm test

      - name: Evals do classificador (gate de qualidade mínima antes do deploy)
        run: npm run evals
